            변경분 (줄 앞 숫자는 신규 파일 기준 줄번호, '+' 추가, '-' 삭제):

            {{#parse.llm_input#}}

            이미 규칙 기반 점검이 찾은 후보 (중복 제외용):
            {{#parse.rule_findings_json#}}

            참고 지식 (업무 지식 + 공통 점검 기준. 샘플 규칙이며 무엇을 볼지 알려 주는 참고용입니다. 지적의 근거는 반드시 위 변경분에서 인용):
