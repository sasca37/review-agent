    - data:
        code: "import json\nimport re\n\nIDENT = re.compile(r\"[A-Za-z_][A-Za-z0-9_]{4,}\"\
          )\nWORD = re.compile(r\"[A-Z]+(?![a-z])|[A-Z]?[a-z]+\")\nHUNK = re.compile(r\"\
          ^@@ -(\\d+)(?:,(\\d+))? \\+(\\d+)(?:,(\\d+))? @@\")\nCOMMON_TYPOS = {\n\
          \    \"recieve\": \"receive\", \"lenght\": \"length\", \"adress\": \"address\"\
          , \"sucess\": \"success\",\n    \"occured\": \"occurred\", \"seperate\"\
          : \"separate\", \"paramter\": \"parameter\",\n    \"retrun\": \"return\"\
          , \"fucntion\": \"function\", \"udpate\": \"update\", \"tranfer\": \"transfer\"\
          ,\n    \"acount\": \"account\", \"accout\": \"account\", \"balace\": \"\
          balance\", \"ammount\": \"amount\",\n    \"amout\": \"amount\", \"expried\"\
          : \"expired\", \"pasword\": \"password\", \"usre\": \"user\",\n    \"mesage\"\
          : \"message\", \"reponse\": \"response\", \"reqeust\": \"request\", \"tyep\"\
          : \"type\",\n}\nMAX_LLM_CHARS = 30000\n\n\ndef osa(a, b):\n    \"\"\"전치(철자\
          \ 순서 바뀜)를 1회로 세는 편집 거리.\"\"\"\n    d = [[0] * (len(b) + 1) for _ in range(len(a)\
          \ + 1)]\n    for i in range(len(a) + 1):\n        d[i][0] = i\n    for j\
          \ in range(len(b) + 1):\n        d[0][j] = j\n    for i in range(1, len(a)\
          \ + 1):\n        for j in range(1, len(b) + 1):\n            c = 0 if a[i\
          \ - 1] == b[j - 1] else 1\n            d[i][j] = min(d[i - 1][j] + 1, d[i][j\
          \ - 1] + 1, d[i - 1][j - 1] + c)\n            if i > 1 and j > 1 and a[i\
          \ - 1] == b[j - 2] and a[i - 2] == b[j - 1]:\n                d[i][j] =\
          \ min(d[i][j], d[i - 2][j - 2] + 1)\n    return d[len(a)][len(b)]\n\n\n\
          def strip_prefix(p):\n    p = p.strip().split(\"\\t\")[0]\n    return p[2:]\
          \ if p[:2] in (\"a/\", \"b/\") else p\n\n\ndef parse(diff_text):\n    files,\
          \ cur = [], None\n    old_left = new_left = new_no = 0\n\n    def new_file(path=\"\
          \"):\n        f = {\"path\": path, \"status\": \"modified\", \"added\":\
          \ 0, \"removed\": 0,\n             \"added_lines\": [], \"other\": [], \"\
          numbered\": [], \"raw\": [], \"seen_hunk\": False}\n        files.append(f)\n\
          \        return f\n\n    for raw in diff_text.splitlines():\n        in_hunk\
          \ = old_left > 0 or new_left > 0\n        if in_hunk and cur is not None\
          \ and (raw == \"\" or raw[:1] in (\" \", \"-\", \"+\", \"\\\\\")):\n   \
          \         cur[\"raw\"].append(raw)\n            sign, text = (raw[:1], raw[1:])\
          \ if raw else (\" \", \"\")\n            if sign == \"+\":\n           \
          \     cur[\"added\"] += 1\n                cur[\"added_lines\"].append((new_no,\
          \ text))\n                cur[\"numbered\"].append(\"%4d + %s\" % (new_no,\
          \ text))\n                new_no += 1\n                new_left -= 1\n \
          \           elif sign == \"-\":\n                cur[\"removed\"] += 1\n\
          \                cur[\"other\"].append(text)\n                cur[\"numbered\"\
          ].append(\"     - %s\" % text)\n                old_left -= 1\n        \
          \    elif sign == \" \":\n                cur[\"other\"].append(text)\n\
          \                cur[\"numbered\"].append(\"%4d   %s\" % (new_no, text))\n\
          \                new_no += 1\n                old_left -= 1\n          \
          \      new_left -= 1\n            continue\n        old_left = new_left\
          \ = 0\n        if raw.startswith(\"diff --git \"):\n            m = re.match(r\"\
          diff --git a/(.*) b/(.*)\", raw)\n            cur = new_file(m.group(2)\
          \ if m else raw[11:].strip())\n            cur[\"raw\"].append(raw)\n  \
          \          continue\n        m = HUNK.match(raw)\n        if m and cur is\
          \ not None:\n            cur[\"seen_hunk\"] = True\n            old_left\
          \ = int(m.group(2)) if m.group(2) is not None else 1\n            new_left\
          \ = int(m.group(4)) if m.group(4) is not None else 1\n            new_no\
          \ = int(m.group(3))\n            cur[\"raw\"].append(raw)\n            cur[\"\
          numbered\"].append(raw)\n            continue\n        if raw.startswith(\"\
          --- \"):\n            if cur is None or cur[\"seen_hunk\"]:\n          \
          \      cur = new_file()\n            cur[\"raw\"].append(raw)\n        \
          \    if \"/dev/null\" in raw:\n                cur[\"status\"] = \"added\"\
          \n            elif not cur[\"path\"]:\n                cur[\"path\"] = strip_prefix(raw[4:])\n\
          \            continue\n        if cur is None:\n            continue\n \
          \       cur[\"raw\"].append(raw)\n        if raw.startswith(\"+++ \"):\n\
          \            if \"/dev/null\" in raw:\n                cur[\"status\"] =\
          \ \"deleted\"\n            else:\n                cur[\"path\"] = strip_prefix(raw[4:])\n\
          \        elif raw.startswith(\"new file mode\"):\n            cur[\"status\"\
          ] = \"added\"\n        elif raw.startswith(\"deleted file mode\"):\n   \
          \         cur[\"status\"] = \"deleted\"\n        elif raw.startswith(\"\
          rename to \"):\n            cur[\"status\"] = \"renamed\"\n            cur[\"\
          path\"] = raw[10:].strip()\n    return [f for f in files if f[\"path\"]]\n\
          \n\ndef check_typos(files):\n    all_text = \"\\n\".join(\n        \"\\\
          n\".join(t for _, t in f[\"added_lines\"]) + \"\\n\" + \"\\n\".join(f[\"\
          other\"]) for f in files)\n    counts = {}\n    for i in IDENT.findall(all_text):\n\
          \        counts[i] = counts.get(i, 0) + 1\n    out, seen = [], set()\n \
          \   for f in files:\n        for lineno, text in f[\"added_lines\"]:\n \
          \           for ident in sorted(set(IDENT.findall(text))):\n           \
          \     if (f[\"path\"], lineno, ident) in seen:\n                    continue\n\
          \                hit = None\n                for w in WORD.findall(ident):\n\
          \                    if w.lower() in COMMON_TYPOS:\n                   \
          \     hit = (\"'%s' 의 '%s' 는 '%s' 의 오타로 보입니다.\" % (ident, w, COMMON_TYPOS[w.lower()]),\
          \ \"지적\")\n                        break\n                if hit is None\
          \ and counts.get(ident) == 1:\n                    cand = near_match(ident,\
          \ counts)\n                    if cand:\n                        hit = (\"\
          '%s' 는 이 변경분에서 %d회 쓰인 '%s' 와 철자가 거의 같습니다. 오타인지 확인하세요.\"\n              \
          \                 % (ident, counts[cand], cand), \"확인 필요\")\n          \
          \      if hit:\n                    seen.add((f[\"path\"], lineno, ident))\n\
          \                    out.append({\"type\": \"typo\", \"file\": f[\"path\"\
          ], \"line\": lineno, \"evidence\": text.strip(),\n                     \
          \           \"reason\": hit[0], \"status\": hit[1], \"source\": \"rule\"\
          })\n    return out\n\n\ndef near_match(ident, counts):\n    low = ident.lower()\n\
          \    for cand, n in counts.items():\n        if cand == ident or n < 2 or\
          \ abs(len(cand) - len(ident)) > 1:\n            continue\n        cl = cand.lower()\n\
          \        if cl == low or cl.startswith(low) or low.startswith(cl):\n   \
          \         continue\n        d = osa(low, cl)\n        if d > 2 or float(d)\
          \ / max(len(low), 1) > 0.25:\n            continue\n        diffs = [(a,\
          \ b) for a, b in zip(low, cl) if a != b]\n        if diffs and all(a.isdigit()\
          \ and b.isdigit() for a, b in diffs):\n            continue\n        return\
          \ cand\n    return None\n\n\ndef check_git_status(files, git_status):\n\
          \    in_diff = set(f[\"path\"] for f in files)\n    out = []\n    for line\
          \ in (git_status or \"\").splitlines():\n        m = re.match(r\"^\\s*([MADRCU?!]{1,2})\\\
          s+(.+)$\", line)\n        if not m:\n            continue\n        code,\
          \ path = m.group(1), m.group(2).split(\" -> \")[-1].strip().strip('\"')\n\
          \        if path in in_diff or code == \"!!\":\n            continue\n \
          \       untracked = code == \"??\"\n        out.append({\"type\": \"missing_file\"\
          , \"file\": path, \"line\": None, \"evidence\": \"git status: \" + line.strip(),\n\
          \                    \"reason\": \"작업 트리에서 \" + (\"새로 만들어졌지만\" if untracked\
          \ else \"변경됐지만\")\n                              + \" 이번 결재 대상 diff 에 포함되지\
          \ 않았습니다.\",\n                    \"status\": \"확인 필요\" if untracked else\
          \ \"지적\", \"source\": \"rule\"})\n    return out\n\n\ndef main(diff_text:\
          \ str, git_status: str) -> dict:\n    files = parse(diff_text or \"\")\n\
          \    if not files:\n        raise ValueError(\"diff 를 해석할 수 없습니다. 'git diff'\
          \ 결과(unified diff)를 붙여넣었는지 확인하세요.\")\n    rule = check_typos(files) + check_git_status(files,\
          \ git_status)\n\n    table = [\"| 파일 | 상태 | + | - |\", \"|---|---|---|---|\"\
          ]\n    table += [\"| `%s` | %s | %d | %d |\" % (f[\"path\"], f[\"status\"\
          ], f[\"added\"], f[\"removed\"]) for f in files]\n\n    parts = []\n   \
          \ for f in files:\n        parts.append(\"### %s (%s)\\n%s\" % (f[\"path\"\
          ], f[\"status\"], \"\\n\".join(f[\"numbered\"])))\n    llm_input = \"\\\
          n\\n\".join(parts)\n    notice = \"\"\n    if len(llm_input) > MAX_LLM_CHARS:\n\
          \        llm_input = llm_input[:MAX_LLM_CHARS]\n        notice = \"diff\
          \ 가 길어 앞 %d자만 LLM 이 검토했습니다.\" % MAX_LLM_CHARS\n\n    snippets = []\n   \
          \ for f in files:\n        snippets.append(f[\"path\"] + \"\\n\" + \"\\\
          n\".join(t for _, t in f[\"added_lines\"][:40]))\n    kb_query = (\"로직 오류\
          \ 오타 미반영 파일 점검\\n\" + \"\\n\".join(snippets))[:1500]\n\n    files_json =\
          \ [{\"path\": f[\"path\"], \"status\": f[\"status\"], \"added\": f[\"added\"\
          ], \"removed\": f[\"removed\"],\n                   \"text\": \"\\n\".join(f[\"\
          raw\"])} for f in files]\n    return {\n        \"files_table\": \"\\n\"\
          .join(table),\n        \"llm_input\": llm_input,\n        \"rule_findings_json\"\
          : json.dumps(rule, ensure_ascii=False),\n        \"files_json\": json.dumps(files_json,\
          \ ensure_ascii=False),\n        \"notice\": notice,\n        \"kb_query\"\
          : kb_query,\n    }\n"
        code_language: python3
        desc: 변경 파일 목록을 만들고 오타·미반영 파일 후보를 규칙으로 찾습니다.
        outputs:
          files_json:
            children: null
            type: string
          files_table:
            children: null
            type: string
          kb_query:
            children: null
            type: string
          llm_input:
            children: null
            type: string
          notice:
            children: null
            type: string
          rule_findings_json:
            children: null
            type: string
        selected: false
        title: diff list 정리·규칙 점검
