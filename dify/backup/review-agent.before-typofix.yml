    - data:
        code: "import json\nimport re\n\nTYPES = {\"logic\": \"로직 오류\", \"typo\":\
          \ \"오타\", \"missing_file\": \"미반영 파일\"}\n\n\ndef norm(s):\n    return re.sub(r\"\
          \\s+\", \"\", s or \"\")\n\n\ndef parse_llm(text):\n    m = re.search(r\"\
          \\[.*\\]\", text or \"\", re.S)\n    if not m:\n        return None\n  \
          \  try:\n        data = json.loads(m.group(0))\n    except ValueError:\n\
          \        return None\n    return [d for d in data if isinstance(d, dict)]\n\
          \n\ndef cell(s):\n    return str(s).replace(\"|\", \"\\\\|\").replace(\"\
          \\n\", \" \")\n\n\ndef main(llm_text: str, rule_findings_json: str, files_json:\
          \ str, notice: str) -> dict:\n    files = json.loads(files_json)\n    by_path\
          \ = dict((f[\"path\"], f) for f in files)\n    notes = [notice] if notice\
          \ else []\n    findings = json.loads(rule_findings_json)\n\n    items =\
          \ parse_llm(llm_text)\n    if items is None:\n        notes.append(\"LLM\
          \ 응답을 해석하지 못해 로직 점검 결과가 포함되지 않았습니다. 다시 실행하세요.\")\n        items = []\n \
          \   for it in items:\n        t = it.get(\"type\")\n        if t not in\
          \ TYPES:\n            continue\n        path, evidence = str(it.get(\"file\"\
          , \"\")), str(it.get(\"evidence\", \"\")).strip()\n        status = \"확인\
          \ 필요\" if it.get(\"needs_check\") else \"지적\"\n        reason = str(it.get(\"\
          reason\", \"\")).strip()\n        # 인용한 근거가 해당 파일 diff 에 실제로 있는지 확인, 없으면\
          \ '확인 필요'\n        f = by_path.get(path)\n        if f is None or not evidence\
          \ or norm(evidence) not in norm(f[\"text\"]):\n            status = \"확인\
          \ 필요\"\n            reason += \" (인용한 근거가 diff 에서 확인되지 않아 '확인 필요'로 분류)\"\
          \n        line = it.get(\"line\") if isinstance(it.get(\"line\"), int) else\
          \ None\n        findings.append({\"type\": t, \"file\": path, \"line\":\
          \ line, \"evidence\": evidence,\n                         \"reason\": reason,\
          \ \"status\": status, \"source\": \"llm\"})\n\n    seen, uniq = set(), []\n\
          \    for f in findings:\n        k = (f[\"type\"], f[\"file\"], f[\"line\"\
          ], norm(f[\"evidence\"]))\n        if k not in seen:\n            seen.add(k)\n\
          \            uniq.append(f)\n    uniq.sort(key=lambda f: (f[\"status\"]\
          \ != \"지적\", f[\"file\"], f[\"line\"] or 0))\n\n    n_found = len([f for\
          \ f in uniq if f[\"status\"] == \"지적\"])\n    lines = [\"## 사전 점검 결과\",\
          \ \"\",\n             \"- 변경 파일 %d개 · 지적 %d건 · 확인 필요 %d건\" % (len(files),\
          \ n_found, len(uniq) - n_found), \"\"]\n    lines += [\"### 지적 사항\", \"\"\
          ]\n    if uniq:\n        lines += [\"| 구분 | 유형 | 위치 | 근거 | 설명 |\", \"|---|---|---|---|---|\"\
          ]\n        for f in uniq:\n            loc = f[\"file\"] + (\":%d\" % f[\"\
          line\"] if f[\"line\"] else \"\")\n            lines.append(\"| %s | %s\
          \ | `%s` | `%s` | %s |\" % (\n                f[\"status\"], TYPES[f[\"\
          type\"]], cell(loc), cell(f[\"evidence\"]), cell(f[\"reason\"])))\n    else:\n\
          \        lines.append(\"점검한 범위에서 지적할 사항이 없습니다. (점검 범위 밖의 오류는 여전히 있을 수 있습니다)\"\
          )\n    if notes:\n        lines += [\"\", \"### 안내\"] + [\"- \" + n for\
          \ n in notes]\n    lines += [\"\", \"> AI 는 오류 후보를 제안할 뿐입니다. 수정 여부는 개발자가\
          \ 정하고, 고친 뒤 다시 점검할 수 있습니다. \"\n              \"③ 동료 코드리뷰는 그대로 진행하세요.\"]\n\
          \    return {\"report\": \"\\n\".join(lines), \"findings_json\": json.dumps(uniq,\
          \ ensure_ascii=False)}\n"
        code_language: python3
        desc: 인용한 근거가 diff 에 없으면 '확인 필요'로 내리고 결과를 합칩니다.
        outputs:
          findings_json:
            children: null
            type: string
          report:
            children: null
            type: string
        selected: false
        title: 근거 검증·결과 정리
