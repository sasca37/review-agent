    - data:
        code: "def fmt(items, label):\n    out = []\n    for i, it in enumerate(items\
          \ or []):\n        c = it.get(\"content\") if isinstance(it, dict) else\
          \ it\n        c = str(c or \"\").strip()\n        if c:\n            out.append(\"\
          [%s %d]\\n%s\" % (label, i + 1, c))\n    return out\n\n\ndef main(common:\
          \ list, task_hits: list, task: str) -> dict:\n    parts = fmt(task_hits,\
          \ \"업무 지식: \" + (task or \"미지정\")) + fmt(common, \"공통 점검 기준\")\n    text\
          \ = \"\\n\\n\".join(parts) or \"(검색된 참고 지식 없음)\"\n    return {\"knowledge_text\"\
          : text[:8000]}\n"
        code_language: python3
        desc: 업무 지식과 공통 점검 기준을 하나의 참고 텍스트로 만듭니다.
