    - id: merge
      type: custom
      position:
        x: 2720
        y: 220
      positionAbsolute:
        x: 2720
        y: 220
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        desc: 인용한 근거가 diff 에 없으면 '확인 필요'로 내리고 결과를 합칩니다.
        selected: false
        type: code
        title: 근거 검증·결과 정리
        code_language: python3
        code: |
          import json
          import re

          TYPES = {"logic": "로직 오류", "typo": "오타", "missing_file": "미반영 파일"}


          def norm(s):
              return re.sub(r"\s+", "", s or "")


          def parse_llm(text):
              m = re.search(r"\[.*\]", text or "", re.S)
              if not m:
                  return None
              try:
                  data = json.loads(m.group(0))
              except ValueError:
                  return None
              return [d for d in data if isinstance(d, dict)]


          def cell(s):
              return str(s).replace("|", "\\|").replace("\n", " ")


          def main(llm_text: str, rule_findings_json: str, files_json: str, notice: str) -> dict:
              files = json.loads(files_json)
              by_path = dict((f["path"], f) for f in files)
              notes = [notice] if notice else []
              findings = json.loads(rule_findings_json)

              items = parse_llm(llm_text)
              if items is None:
                  notes.append("LLM 응답을 해석하지 못해 로직 점검 결과가 포함되지 않았습니다. 다시 실행하세요.")
                  items = []
              for it in items:
                  t = it.get("type")
                  if t not in TYPES:
                      continue
                  path, evidence = str(it.get("file", "")), str(it.get("evidence", "")).strip()
                  status = "확인 필요" if it.get("needs_check") else "지적"
                  reason = str(it.get("reason", "")).strip()
                  # 인용한 근거가 해당 파일 diff 에 실제로 있는지 확인, 없으면 '확인 필요'
                  f = by_path.get(path)
                  if f is None or not evidence or norm(evidence) not in norm(f["text"]):
                      status = "확인 필요"
                      reason += " (인용한 근거가 diff 에서 확인되지 않아 '확인 필요'로 분류)"
                  line = it.get("line") if isinstance(it.get("line"), int) else None
                  findings.append({"type": t, "file": path, "line": line, "evidence": evidence,
                                   "reason": reason, "status": status, "source": "llm"})

              seen, uniq = set(), []
              for f in findings:
                  k = (f["type"], f["file"], f["line"], norm(f["evidence"]))
                  if k not in seen:
                      seen.add(k)
                      uniq.append(f)
              uniq.sort(key=lambda f: (f["status"] != "지적", f["file"], f["line"] or 0))

              n_found = len([f for f in uniq if f["status"] == "지적"])
              lines = ["## 사전 점검 결과", "",
                       "- 변경 파일 %d개 · 지적 %d건 · 확인 필요 %d건" % (len(files), n_found, len(uniq) - n_found), ""]
              lines += ["### 지적 사항", ""]
              if uniq:
                  lines += ["| 구분 | 유형 | 위치 | 근거 | 설명 |", "|---|---|---|---|---|"]
                  for f in uniq:
                      loc = f["file"] + (":%d" % f["line"] if f["line"] else "")
                      lines.append("| %s | %s | `%s` | `%s` | %s |" % (
                          f["status"], TYPES[f["type"]], cell(loc), cell(f["evidence"]), cell(f["reason"])))
              else:
                  lines.append("점검한 범위에서 지적할 사항이 없습니다. (점검 범위 밖의 오류는 여전히 있을 수 있습니다)")
              if notes:
                  lines += ["", "### 안내"] + ["- " + n for n in notes]
              lines += ["", "> AI 는 오류 후보를 제안할 뿐입니다. 수정 여부는 개발자가 정하고, 고친 뒤 다시 점검할 수 있습니다. "
                        "③ 동료 코드리뷰는 그대로 진행하세요."]
              return {"report": "\n".join(lines), "findings_json": json.dumps(uniq, ensure_ascii=False)}
        variables:
        - variable: llm_text
          value_selector:
          - llm
          - text
          value_type: string
        - variable: rule_findings_json
          value_selector:
          - parse
          - rule_findings_json
          value_type: string
        - variable: files_json
          value_selector:
          - parse
          - files_json
          value_type: string
        - variable: notice
          value_selector:
          - parse
          - notice
          value_type: string
        outputs:
          report:
            type: string
            children: null
          findings_json:
            type: string
            children: null
